<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Printan tests：.ptan 遷移與匯出／匯入</title>
<style>
body { font: 14px/1.6 system-ui, sans-serif; margin: 16px; }
li { list-style: none; }
.pass { color: #1a7f37; }
.fail { color: #cf222e; }
pre { margin: 0 0 0 24px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1 id="summary">執行中…</h1>
<ul id="list"></ul>
<script type="module">
// 只測純函式與檔案讀寫，跟 tests/index.html 同一套跑法（開啟頁面即執行，標題顯示 PASS／FAIL）。
import {
    applyTextStylePreset, createGroupElement, createTextElement, TEXT_STYLE_PRESETS, walkElements,
} from "../js/core/document-model.js";
import { createEmptyProject, loadProject, serializeProject, PTAN_VERSION } from "../js/core/schema.js";
import { downloadPtan, readPtanFile } from "../js/core/ptan-file.js";
import { ptToDots } from "../js/core/units.js";

const TEST_DPI = 203; // epson-tm-t82ii 預設 profile 的 dpi.x，樣式預設測試用來把 pt 換算成 dots

const cases = [];
const test = (name, fn) => cases.push({ name, fn });
function assert(cond, msg = "assert failed") { if (!cond) throw new Error(msg); }
function eq(actual, expected, msg = "") {
    const a = JSON.stringify(actual), b = JSON.stringify(expected);
    if (a !== b) throw new Error(`${msg}\n預期 ${b}\n實際 ${a}`);
}
const clone = (v) => JSON.parse(JSON.stringify(v));

// 手寫的 v1 檔（舊版扁平 text 欄位、row 內巢狀、各種元素類型都有），不是用現行建構函式產生的，
// 這樣建構函式日後加欄位不會讓 fixture 跟著變、也就不會讓遷移的對照失去意義。
const V1_FILE = {
    format: "ptan",
    version: 1,
    meta: { name: "舊版收據", createdAt: "2025-01-01T00:00:00.000Z", updatedAt: "2025-01-02T00:00:00.000Z" },
    printerProfile: { id: "epson-tm-t82ii" },
    paper: { widthId: "80mm" },
    variables: ["name"],
    template: { elements: [
        { id: "t1", type: "text", text: "哈囉 {{name}}", fontSize: 40, bold: true, align: "center" },
        { id: "s1", type: "spacer", heightDots: 16 },
        { id: "r1", type: "row", ratio: [1, 2], columns: [
            [{ id: "t2", type: "text", text: "左" }],
            [{ id: "b1", type: "barcode", format: "qrcode", value: "{{name}}" }, { id: "d1", type: "divider", style: "dashed" }],
        ] },
        { id: "i1", type: "image", assetId: "a1" },
    ] },
    assets: [{ id: "a1", name: "logo.png", type: "image/png", dataUrl: "data:image/png;base64,AAAA" }],
};

const textsOf = (project) => {
    const out = [];
    walkElements(pageEls(project), (e) => { if (e.type === "text") out.push(e); });
    return out;
};
// 匯入後一律是 template.pages（單頁也一樣，見 schema.js migrate），這個檔案大多只處理單頁專案。
function pageEls(project) {
    return project.template.pages[0].elements;
}

// ---- 圖片 fit 新值 ----
test("圖片 fit：none／auto／stretch 與不認得的值載入後原樣保留（渲染端負責退回 auto）", () => {
    for (const fit of ["none", "auto", "stretch", "bogus"]) {
        const file = clone(V1_FILE);
        file.template.elements[3].fit = fit;
        const out = loadProject(file);
        assert(out.ok, out.error);
        eq(pageEls(out.project)[3].fit, fit);
    }
});

// ---- v1 → 目前版本 遷移 ----
test("v1 檔遷移：扁平 text 變 runs，其餘欄位與非文字元素原樣保留", () => {
    const out = loadProject(clone(V1_FILE));
    assert(out.ok, out.error);
    const [t1, s1, r1, i1] = pageEls(out.project);
    eq(t1.runs, [{ text: "哈囉 {{name}}" }]);
    assert(!("text" in t1), "舊的 text 欄位應被移除");
    eq([t1.id, t1.fontSize, t1.bold, t1.align], ["t1", 40, true, "center"]);
    eq(s1, V1_FILE.template.elements[1]);
    eq(i1, V1_FILE.template.elements[3]);
    eq(r1.columns[0][0].runs, [{ text: "左" }]);
    eq(r1.columns[1], V1_FILE.template.elements[2].columns[1]);
    eq(r1.ratio, [1, 2]);
});
test("v1 檔遷移：meta、印表機、紙寬、變數、素材都不變", () => {
    const out = loadProject(clone(V1_FILE));
    assert(out.ok, out.error);
    for (const key of ["meta", "printerProfile", "paper", "variables", "assets"]) {
        eq(out.project[key], V1_FILE[key], key);
    }
});
test("遷移不改動傳入的物件", () => {
    const raw = clone(V1_FILE);
    loadProject(raw);
    eq(raw, V1_FILE);
});
test("遷移後再匯出、再匯入：內容不再變化（冪等）", () => {
    const first = loadProject(clone(V1_FILE));
    assert(first.ok, first.error);
    const second = loadProject(serializeProject(first.project));
    assert(second.ok, second.error);
    eq(second.project, first.project);
});
test("沒有群組的 v1 檔重新匯出仍是 v1（舊版 Printan 也能開）", () => {
    const out = loadProject(clone(V1_FILE));
    eq(JSON.parse(serializeProject(out.project)).version, 1);
});
test("v1 檔加上群組後匯出為 v2（單頁專案，不因為目前版本是 v3 就跟著升版），重新匯入群組內容不變", () => {
    const out = loadProject(clone(V1_FILE));
    const project = out.project;
    pageEls(project).push(createGroupElement([createTextElement({ id: "gt", runs: [{ text: "組內" }] })]));
    const text = serializeProject(project);
    eq(JSON.parse(text).version, 2);
    const back = loadProject(text);
    assert(back.ok, back.error);
    eq(pageEls(back.project), pageEls(project));
});
test("v2 檔內群組裡的舊版扁平 text 也會遷移", () => {
    const out = loadProject({ format: "ptan", version: 2, template: { elements: [
        { id: "g", type: "group", children: [{ id: "x", type: "text", text: "群組舊文字" }] },
    ] } });
    assert(out.ok, out.error);
    eq(pageEls(out.project)[0].children[0].runs, [{ text: "群組舊文字" }]);
});
test("未知的額外欄位匯出再匯入後保留（向前相容）", () => {
    const raw = { ...clone(V1_FILE), futureThing: { a: 1 } };
    const out = loadProject(serializeProject(loadProject(raw).project));
    eq(out.project.futureThing, { a: 1 });
});

// ---- .ptan 檔案來回 ----
test("readPtanFile：v1 檔與直接 loadProject 的結果一致", async () => {
    const viaFile = await readPtanFile(new File([JSON.stringify(V1_FILE)], "old.ptan"));
    const direct = loadProject(clone(V1_FILE));
    assert(viaFile.ok, viaFile.error);
    // V1_FILE 沒有 pageId（舊檔本來就不會有），migrate() 幫隱含頁合成的 id 只在同一次
    // migrate() 呼叫內是穩定的；這裡是兩次各自獨立的 loadProject，各自合成的頁面 id
    // 本來就不會相同（id 不是檔案內容本身），比較內容用 pageEls，其餘欄位另外逐一比較。
    eq(pageEls(viaFile.project), pageEls(direct.project));
    for (const key of ["meta", "printerProfile", "paper", "variables", "assets"]) eq(viaFile.project[key], direct.project[key], key);
});
test("serializeProject → File → readPtanFile：完整專案來回一致", async () => {
    const p = createEmptyProject({ name: "來回", printerProfileId: "epson-tm-t82ii", paperWidthId: "58mm" });
    p.template.pages[0].elements = pageEls(loadProject(clone(V1_FILE)).project);
    pageEls(p).push(createGroupElement([createTextElement({ runs: [{ text: "甲", italic: true }, { text: "乙" }] })]));
    p.variables = ["name"];
    p.assets = clone(V1_FILE.assets);
    const back = await readPtanFile(new File([serializeProject(p)], "x.ptan"));
    assert(back.ok, back.error);
    eq(back.project.template, p.template);
    for (const key of ["meta", "printerProfile", "paper", "variables", "assets"]) eq(back.project[key], p[key], key);
});
test("downloadPtan：實際產生的檔案內容能被 readPtanFile 讀回，檔名補 .ptan", async () => {
    const p = loadProject(clone(V1_FILE)).project;
    let blob = null;
    let fileName = "";
    const realCreate = URL.createObjectURL;
    const realRevoke = URL.revokeObjectURL;
    const realClick = HTMLAnchorElement.prototype.click;
    URL.createObjectURL = (b) => { blob = b; return "blob:test"; };
    URL.revokeObjectURL = () => {};
    HTMLAnchorElement.prototype.click = function () { fileName = this.download; };
    try {
        const failed = await downloadPtan(p, "我的版型.ptan");
        eq(failed, []);
    } finally {
        URL.createObjectURL = realCreate;
        URL.revokeObjectURL = realRevoke;
        HTMLAnchorElement.prototype.click = realClick;
    }
    eq(fileName, "我的版型.ptan");
    assert(blob, "沒有產生 Blob");
    const back = await readPtanFile(new File([blob], fileName));
    assert(back.ok, back.error);
    eq(back.project, p);
});
test("內嵌字體：匯出 v2 → readPtanFile 讀回後字體不留在專案、其餘不變", async () => {
    const p = loadProject(clone(V1_FILE)).project;
    const fonts = [{ family: "不存在的字體", weight: 400, unicodeRange: "U+0-7F", data: "AAEC" }];
    const text = serializeProject({ ...p, embeddedFonts: fonts });
    eq(JSON.parse(text).version, 2); // 單頁專案，不因為目前版本是 v3 就跟著升版
    const back = await readPtanFile(new File([text], "f.ptan"));
    assert(back.ok, back.error);
    assert(!("embeddedFonts" in back.project), "embeddedFonts 應被移除");
    eq(back.project.template, p.template);
});

// ---- 執行 ----
const list = document.getElementById("list");
test("多欄 gap：非 0 才寫進檔案、來回一致；0 或缺欄位不寫、讀入後仍沒有 gap", async () => {
    const p = createEmptyProject({ name: "gap", printerProfileId: "epson-tm-t82ii", paperWidthId: "58mm" });
    const mk = (id, gap) => ({ id, type: "row", ratio: [1, 1], columns: [[], []], ...(gap === undefined ? {} : { gap }) });
    p.template.pages[0].elements = [mk("g8", 8), mk("g0", 0), mk("gn"), mk("g48", 48)];
    const text = serializeProject(p);
    const raw = JSON.parse(text).template.elements;
    eq(raw.map((r) => r.gap), [8, undefined, undefined, 48]);
    assert(!("gap" in raw[1]), "gap=0 不該寫入");
    assert(pageEls(p)[1].gap === 0, "序列化不可改動原專案");
    const back = await readPtanFile(new File([text], "x.ptan"));
    assert(back.ok, back.error);
    eq(pageEls(back.project).map((r) => r.gap), [8, undefined, undefined, 48]);
    eq(serializeProject(back.project), text);
});
// ---- 文字樣式預設（stylePreset） ----
test("applyTextStylePreset：套用會展開成具體欄位並記錄 stylePreset", () => {
    const el = createTextElement({ fontSize: 999, bold: false, lineHeight: 9, letterSpacing: 9 });
    applyTextStylePreset(el, "H1", TEST_DPI);
    eq(el.stylePreset, "H1");
    eq(el.fontSize, ptToDots(TEXT_STYLE_PRESETS.H1.fontSizePt, TEST_DPI), "fontSize");
    eq(el.bold, TEXT_STYLE_PRESETS.H1.bold, "bold");
    eq(el.lineHeight, TEXT_STYLE_PRESETS.H1.lineHeight, "lineHeight");
    eq(el.letterSpacing, TEXT_STYLE_PRESETS.H1.letterSpacing, "letterSpacing");
});
test("applyTextStylePreset：傳 null 只清掉標記，不動其餘欄位（使用者可能想保留目前數值繼續手動調）", () => {
    const el = createTextElement();
    applyTextStylePreset(el, "H5", TEST_DPI);
    el.fontSize = 77; // 模擬套用後手動改過
    applyTextStylePreset(el, null, TEST_DPI);
    assert(!("stylePreset" in el), "stylePreset 應該被清掉");
    eq(el.fontSize, 77, "手動改過的值不該被清掉標記這個動作動到");
});
test("applyTextStylePreset：不認得的 preset 名稱視同 null（改回自訂）", () => {
    const el = createTextElement();
    applyTextStylePreset(el, "H1", TEST_DPI);
    applyTextStylePreset(el, "bogus", TEST_DPI);
    assert(!("stylePreset" in el));
});
test("applyTextStylePreset：preset 拒絕繼承屬性名稱（constructor／toString 這類），視同自訂", () => {
    const el = createTextElement({ fontSize: 55 });
    applyTextStylePreset(el, "constructor", TEST_DPI);
    assert(!("stylePreset" in el), "constructor 不是合法 preset key，不該被當成套用成功");
    eq(el.fontSize, 55, "沒有套用任何預設，原本的值不該被動到");
});

test("stylePreset：套用預設的文字元素存檔再讀回，preset 與展開後的欄位都不變", () => {
    const p = createEmptyProject({ name: "樣式", printerProfileId: "epson-tm-t82ii", paperWidthId: "80mm" });
    const el = createTextElement({ id: "t1", runs: [{ text: "標題文字" }] });
    applyTextStylePreset(el, "H1", TEST_DPI);
    p.template.pages[0].elements = [el];
    const back = loadProject(serializeProject(p));
    assert(back.ok, back.error);
    const got = pageEls(back.project)[0];
    eq(got.stylePreset, "H1");
    eq(got.fontSize, ptToDots(TEXT_STYLE_PRESETS.H1.fontSizePt, TEST_DPI));
    eq(got.bold, TEXT_STYLE_PRESETS.H1.bold);
});
test("stylePreset：沒套用預設（自訂）的文字元素存檔不會寫出 stylePreset 欄位", () => {
    const p = createEmptyProject({ name: "自訂", printerProfileId: "epson-tm-t82ii", paperWidthId: "80mm" });
    p.template.pages[0].elements = [createTextElement({ id: "t1", runs: [{ text: "自訂文字" }] })];
    const text = serializeProject(p);
    assert(!("stylePreset" in JSON.parse(text).template.elements[0]), "自訂狀態不該寫出 stylePreset 欄位");
});
test("舊檔（沒有 stylePreset 欄位）載入後文字元素視為自訂，不需要 migration、不會出錯", () => {
    const oldFile = clone(V1_FILE); // V1_FILE 的 text 元素本來就沒有 stylePreset 欄位
    const out = loadProject(oldFile);
    assert(out.ok, out.error);
    const t1 = pageEls(out.project)[0];
    assert(!("stylePreset" in t1), "舊檔沒有這個欄位，載入後也不該自己冒出來");
});
test("壞檔：stylePreset 是不認得的值時，載入後整個欄位被拿掉，退回自訂，不影響其餘欄位", () => {
    const raw = { format: "ptan", version: 2, template: { elements: [
        { id: "t1", type: "text", runs: [{ text: "壞掉的樣式" }], stylePreset: "not-a-real-preset", fontSize: 40 },
    ] } };
    const out = loadProject(raw);
    assert(out.ok, out.error);
    const t1 = pageEls(out.project)[0];
    assert(!("stylePreset" in t1), "不認得的值應該被拿掉");
    eq(t1.fontSize, 40, "其餘欄位不受影響");
});

let failed = 0;
for (const c of cases) {
    const li = document.createElement("li");
    try {
        await c.fn();
        li.className = "pass";
        li.textContent = "PASS  " + c.name;
    } catch (err) {
        failed += 1;
        li.className = "fail";
        li.textContent = "FAIL  " + c.name;
        const pre = document.createElement("pre");
        pre.textContent = err.message;
        li.append(pre);
    }
    list.append(li);
}
const summary = document.getElementById("summary");
summary.textContent = failed ? `${failed} / ${cases.length} 失敗` : `全部通過（${cases.length}）`;
summary.className = failed ? "fail" : "pass";
document.title = (failed ? "FAIL " : "PASS ") + summary.textContent;
</script>
</body>
</html>
